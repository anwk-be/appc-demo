<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member login · APPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <main id="main" class="login-shell">
    <!-- Not a WordPress template: in the live site this is the community platform's own sign-in page -->
    <div class="login-card">
      <span class="proto-flag">Concept · nothing is sent</span>
      <h1>APPC member community</h1>
      <p>Working groups, shared files and peers from 28 member posts.</p>
      <form class="form" action="community/index.html">
        <div class="field"><label for="login-email">Work email</label><input id="login-email" type="email" value="mere.tuilagi@postfiji.example" readonly></div>
        <button class="btn btn--navy" type="submit" style="justify-content:center"><span data-icon="lock"></span>Sign in to the community</button>
      </form>
      <p style="margin:16px 0 0;font-size:14px;color:var(--muted)">Your post nominates who gets access. Ask your APPC contact or <a href="contact.html?type=membership">the secretariat</a>.</p>
      <p style="margin:12px 0 0;font-size:15px">Not a member yet? <a href="membership.html">See how to join</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
